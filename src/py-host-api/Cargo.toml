[package]
name = "py-host-api"
version = "0.2.5"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hyperlight-dev/hyperlight-js"
readme = "README.md"
publish = false

# Isolate from the parent workspace so a plain `cargo build` / `just test` of the
# four core crates is never forced to locate a Python interpreter. Built via
# maturin (see pyproject.toml).
[workspace]

[lib]
name = "hyperlight_js"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
# Aliased to `hl_core` because `[lib] name = "hyperlight_js"` (the Python module)
# would otherwise collide with this dependency's own crate name.
hl_core = { package = "hyperlight-js", path = "../hyperlight-js", features = [
    "monitor-wall-clock",
    "monitor-cpu-time",
    "guest-call-stats",
] }
hyperlight-js-common = { path = "../hyperlight-js-common" }
serde_json = "1"

# Hyperlight's host uses signal/longjmp-based guest interrupts; unwinding across
# that boundary is undefined behavior, so the host build must abort on panic.
# Errors are surfaced to Python as `PyErr` (never via unwinding), so this does
# not affect exception propagation.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
