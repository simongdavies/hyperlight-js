[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "hyperlight-js"
version = "0.2.5"
description = "Python host bindings for hyperlight-js — run JavaScript inside a Hyperlight micro-VM sandbox."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/hyperlight-dev/hyperlight-js"

[tool.maturin]
manifest-path = "Cargo.toml"
# The abi3 stable-ABI feature produces a single wheel that works on CPython 3.9+.
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
