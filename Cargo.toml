[workspace]
resolver = "2"
members = ["src/hyperlight-js", "src/js-host-api", "src/hyperlight-js-runtime", "src/hyperlight-js-common"]
exclude = ["src/hyperlight-js-runtime/tests/fixtures/extended_runtime"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hyperlight-dev/hyperlight-js"
readme = "README.md"

[workspace.dependencies]
hyperlight-common = { git = "https://github.com/simongdavies/hyperlight", branch = "update-surrogate", default-features = false }
hyperlight-guest-bin = { git = "https://github.com/simongdavies/hyperlight", branch = "update-surrogate" }
hyperlight-guest = { git = "https://github.com/simongdavies/hyperlight", branch = "update-surrogate" }
hyperlight-host = { git = "https://github.com/simongdavies/hyperlight", branch = "update-surrogate", default-features = false }
hyperlight-js = { version = "0.1.1", path = "src/hyperlight-js" }
hyperlight-js-common = { version = "0.1.1", path = "src/hyperlight-js-common" }
hyperlight-js-runtime = { version = "0.1.1", path = "src/hyperlight-js-runtime" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
